name: MLOps Monitoring

on:
  push:
    branches: [master]

jobs:
  monitoring:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Train model
        run: python scripts/train_model.py

      - name: Create datasets
        run: python scripts/create_data.py

      - name: Simulate drift
        run: python scripts/simulate_drift.py

      - name: Run monitoring
        run: python scripts/run_monitoring.py